<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabPulse — Forgot Password</title>
  <meta name="description" content="Request a LabPulse password reset link.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vortex: {
              black: '#0A0D12',
              card: '#121722',
              border: '#222A3A',
              white: '#F8FAFC',
              gray: '#8A99AD',
              cyan: '#00F5D4',
              emerald: '#10B981',
              amber: '#F59E0B',
              rose: '#F43F5E',
              violet: '#A855F7',
            }
          },
          fontFamily: {
            display: ['"Inter Tight"', 'Inter', 'sans-serif'],
            sans: ['"Inter Tight"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"Inter Tight"', 'Inter', 'system-ui', 'sans-serif'],
            code: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-vortex-black text-vortex-white font-sans antialiased min-h-screen flex flex-col overflow-x-hidden relative">

  <!-- Animated Background Orbs -->
  <div class="vortex-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <a href="#forgot-card" class="skip-link">SKIP TO RESET FORM</a>

  <header class="glass-nav relative z-10 w-full px-6 sm:px-10 py-4 border-b border-vortex-border flex justify-between items-center">
    <a href="index.html" class="text-sm font-display font-black tracking-tighter text-vortex-white flex items-center space-x-2">
      <span class="w-3 h-3 bg-vortex-cyan inline-block"></span>
      <span>LABPULSE</span>
    </a>
    <span class="font-mono text-xs text-vortex-gray hidden sm:inline">LABORATORY MANAGEMENT PLATFORM</span>
  </header>

  <main class="relative z-10 flex-1 flex items-center justify-center px-6 py-12">
    <div id="forgot-card" class="w-full max-w-md glass-card p-8">
      <h1 class="text-3xl font-display font-black uppercase tracking-tight mb-2">Forgot your password?</h1>
      <p class="font-mono text-xs text-vortex-gray mb-8">ENTER YOUR REGISTERED EMAIL AND WE'LL SEND RESET INSTRUCTIONS.</p>

      <div id="forgot-error" class="hidden mb-6 p-4 border border-vortex-rose/50 bg-vortex-rose/10 font-mono text-xs text-vortex-rose" role="alert"></div>
      <div id="forgot-success" class="hidden mb-6 p-4 border border-vortex-emerald/50 bg-vortex-emerald/10 font-mono text-xs text-vortex-emerald" role="status"></div>

      <form id="forgot-form" class="space-y-6 font-mono text-xs" novalidate>
        <div>
          <label for="forgot-email" class="block text-vortex-gray uppercase mb-2">Email *</label>
          <input type="email" id="forgot-email" name="email" required autocomplete="email" autocapitalize="none" spellcheck="false"
            class="w-full glass-input py-3 px-4 text-vortex-white focus:outline-none focus:border-vortex-cyan transition-colors">
          <p id="forgot-email-error" class="hidden text-vortex-rose text-[11px] mt-2">Enter a valid email address.</p>
        </div>

        <button type="submit" id="forgot-submit" class="w-full py-4 bg-vortex-cyan text-vortex-black font-bold text-sm uppercase hover:bg-white transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed min-h-[44px]">
          SEND RESET LINK
        </button>
      </form>

      <div class="mt-6 text-center font-mono text-xs">
        <a href="login.html" class="text-vortex-cyan hover:text-vortex-white transition-colors uppercase">← Back to Login</a>
      </div>
    </div>
  </main>

  <footer class="glass-nav relative z-10 w-full px-6 sm:px-10 py-6 border-t border-vortex-border font-mono text-xs text-vortex-gray flex justify-between">
    <span>LABPULSE LIMS PLATFORM</span>
    <a href="index.html" class="hover:text-vortex-white transition-colors">← PUBLIC CATALOG</a>
  </footer>

  <script src="auth.js"></script>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('forgot-form');
      var emailInput = document.getElementById('forgot-email');
      var submitBtn = document.getElementById('forgot-submit');
      var errorBox = document.getElementById('forgot-error');
      var successBox = document.getElementById('forgot-success');
      var emailError = document.getElementById('forgot-email-error');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (submitBtn.disabled) return;
        errorBox.classList.add('hidden');
        successBox.classList.add('hidden');
        var email = emailInput.value.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailError.classList.remove('hidden');
          return;
        }
        emailError.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'SENDING…';
        try {
          await window.LabPulseAuth.forgotPassword(email);
          // Generic either way — the backend never reveals whether the email exists.
          successBox.textContent = 'If an account exists for this email, you will receive password reset instructions shortly.';
          successBox.classList.remove('hidden');
          form.reset();
        } catch (err) {
          errorBox.textContent = 'Network error. Check your connection and try again.';
          errorBox.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'SEND RESET LINK';
        }
      });
      emailInput.focus();
    })();
  </script>
</body>
</html>
